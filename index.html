#game {
    width: 100%;
    height: 100%;
    position: absolute;
}

#ui {
    width: 100%;
    height: 100%;
    position: absolute;
    z-index: 10;
}

/* 分数 */
#ui .score-ui {
    width: 120px;
    height: 40px;
    margin-left: 20px;
    line-height: 40px;
    border-bottom: solid 2px #40c061;
    padding: 5px;
}

#ui .score-ui img {
    width: 40px;
    height: 40px;
}

#ui .score-ui span {
    color: #fff;
    font-size: 30px;
    position: absolute;
    left: 80px;
}

/* 游戏开始 */

#ui #start-alert {
    width: 100%;
    height: 100%;
    position: absolute;
    z-index: 30;
}

#start-alert .game-desc {
    width: 80%;
    margin: 100px auto;
    text-align: center;
}

#start-alert .game-desc .logo {
    width: 300px;
}

#start-alert .game-desc p {
    width: 300px;
    margin: 0 auto;
    font-size: 16px;
    line-height: 30px;
    color: #fff;
}

#start-alert footer {
    text-align: center;
    color: #fff;
}

#start-alert footer #start-btn {
    font-size: 36px;
    text-shadow: 0 0 1px #b6ff00, 0 0 2px #b6ff00, 0 0 4px #b6ff00,0 0 7px #b6ff00, 0 0 10px #b6ff00, 0 0 15px #b6ff00;
}

#start-alert footer p {
    margin-top: 100px;
    color: #aaa;
    font-size: 12px;
}

/* 游戏结束 */
#game-over-alert {
    width: 240px;
    height: 80px;
    border: solid 1px rgb(85, 255, 227);
    border-radius: 10px;
    color: #fff;
    text-align: center;
    position: absolute;
    top: 50%;
    left: 50%;
    margin-left: -120px;
    margin-top: -100px;
    z-index: 30;
    display: none;
    background-color:rgba(0,0,0,0.3);
}

#game-over-alert h1 {
    width: 150px;
    margin: 0 auto;
    margin-top: -40px;
    /* color:  rgb(85, 255, 227); */
    text-shadow: 0 0 15px  rgb(85, 255, 227);
}

#game-over-alert #restart-btn {
    font-size: 24px;
    margin-top: 20px;
}

/* 滑动动画 */
.slide-up {
    transform: translateY(-600px);
    transition: transform .4s ease-in-out;
}

.slide-down {
    transform: translateY(600px);
    transition: transform .4s ease-in-out;
}

.virus .letter {
    position: absolute;
    width: 60px;
    height: 60px;
    text-align: center;
    color: #fff;
    line-height: 60px;
    border-radius: 60px;
    font-size: 28px;
    font-weight: 800;
    left: 10px;
    top: 10px;
    box-shadow: 0 0 15px #f00;
}

/* 警告 */
.warning {
    width: 100%;
    height: 100%;
    position: absolute;
    background-image: linear-gradient(to right, rgba(255, 0, 0, .5) 0%, rgba(255, 0, 0, 0) 20%, rgba(0, 0, 0, 0) 80%, rgba(255, 0, 0, .5) 100%) !important;
    z-index: 10;
    animation: color-fade 0.5s 3;
}

/* 警告动画 */
@keyframes color-fade {
    0%{
        opacity: 0;
    }

    50%{
        opacity: 1;
    }
    100%{
        opacity: 0;
    }
}

/* 病毒消失的动画 */
.fade-out {
    opacity: 0;
    transition: opacity 1s;
}

/* Progressive difficulty indicator */
#difficulty-hud { position:absolute; top:18px; right:20px; z-index:5; color:#fff; text-align:right; font:700 18px/1.4 Arial,sans-serif; text-shadow:0 2px 8px #101018,0 0 4px #000; pointer-events:none; }
#difficulty-hud span { display:block; letter-spacing:2px; }
#difficulty-hud small { display:block; font-size:12px; font-weight:500; letter-spacing:.5px; }
#difficulty-hud.level-pop { animation:levelPulse .5s ease-out; }
@keyframes levelPulse { 0% {transform:scale(1.25);color:#ffdf75;} 100% {transform:scale(1);color:#fff;} }
@media(max-width:600px){#difficulty-hud{top:12px;right:10px;font-size:14px}#difficulty-hud small{font-size:10px}}
</style>

  const LEVEL_EVERY = 10;
  const MAX_LEVEL = 15;
  let status = 0, score = 0, level = 1, viruses = [];
  let animationId = 0, spawnTimer = 0, lastFrame = 0, spawnElapsed = 0;
  const levelHUD = document.createElement('div');
  levelHUD.id = 'difficulty-hud';
  levelHUD.innerHTML = '<span>LEVEL <b id="level-number">1</b></span><small id="difficulty-detail">速度 ×1.0 · 每波 1 个</small>';
  uiLayer.appendChild(levelHUD);
  const levelNumber = levelHUD.querySelector('#level-number');
  const detail = levelHUD.querySelector('#difficulty-detail');

  function settings() {
    return {
      speed: Math.min(3 + (level - 1) * 0.5, 10), // px / 16.67ms
      interval: Math.max(280, 800 - (level - 1) * 45),
      count: Math.min(1 + Math.floor((level - 1) / 3), 5)
    };
  }
  function updateDifficulty() {
    level = Math.min(MAX_LEVEL, Math.floor(score / LEVEL_EVERY) + 1);
    const cfg = settings();
    levelNumber.textContent = level;
    detail.textContent = `速度 ×${(cfg.speed / 3).toFixed(1)} · 每波 ${cfg.count} 个`;
    if (level > 1) {
      levelHUD.classList.remove('level-pop');
      void levelHUD.offsetWidth;
      levelHUD.classList.add('level-pop');
    }
  }
  function makeVirus() {
    const virus = document.createElement('div');
    virus.className = 'virus';
    const p = document.createElement('p');
    p.className = 'letter';
    const colors = ['255,0,0', '0,255,0', '0,0,255', '255,255,0', '0,255,255', '255,0,255'];
    const color = colors[Math.floor(Math.random() * colors.length)];
    p.style.backgroundImage = `radial-gradient(rgba(${color},0),rgba(${color},1))`;
    p.style.boxShadow = `0 0 15px rgb(${color})`;
    const letter = letters[Math.floor(Math.random() * letters.length)];
    p.textContent = letter;
    virus.letter = letter;
    virus.appendChild(p);
    const width = Math.max(0, stage.clientWidth - 100);
    virus.style.left = `${Math.random() * width}px`;
    virus.style.top = '0px';
    game.appendChild(virus);
    viruses.push(virus);
  }
  function makeWave() {
    const { count } = settings();
    // A wave grows with the level; distribute its members across the screen.
    for (let i = 0; i < count; i++) makeVirus();
  }
  function showWarning() {
    if (uiLayer.querySelector('.warning')) return;
    const warning = document.createElement('div');
    warning.className = 'warning';
    uiLayer.appendChild(warning);
  }
  function refreshWarning() {
    const threshold = stage.clientHeight - 200;
    const danger = viruses.some(v => v.offsetTop > threshold);
    if (danger) showWarning();
    else uiLayer.querySelector('.warning')?.remove();
  }
  function stopLoop() {
    cancelAnimationFrame(animationId);
    animationId = 0;
  }
  function gameOver() {
    if (status !== 1) return;
    status = 2;
    stopLoop();
    gameoverAlert.style.display = 'block';
  }
  function frame(timestamp) {
    if (status !== 1) return;
    const delta = Math.min(timestamp - (lastFrame || timestamp), 50);
    lastFrame = timestamp;
    const cfg = settings();
    spawnElapsed += delta;
    while (spawnElapsed >= cfg.interval) {
      spawnElapsed -= cfg.interval;
      makeWave();
    }
    const move = cfg.speed * delta / (1000 / 60);
    const bottom = stage.clientHeight;
    for (const virus of viruses) {
      const nextTop = virus.offsetTop + move;
      virus.style.top = `${nextTop}px`;
      if (nextTop >= bottom) {
        gameOver();
        return;
      }
    }
    refreshWarning();
    animationId = requestAnimationFrame(frame);
  }
  function startGame() {
    stopLoop();
    status = 1;
    lastFrame = 0;
    spawnElapsed = 0;
    animationId = requestAnimationFrame(frame);
  }
  function resetGame() {
    stopLoop();
    game.replaceChildren();
    viruses = [];
    score = 0;
    level = 1;
    scoreLabel.textContent = '0';
    uiLayer.querySelector('.warning')?.remove();
    updateDifficulty();
    gameoverAlert.style.display = 'none';
    startGame();
  }
  startAlert.addEventListener('click', () => {
    if (status !== 0) return;
    gameDesc.classList.add('slide-up');
    footer.classList.add('slide-down');
    setTimeout(() => { startAlert.style.display = 'none'; }, 500);
    startGame();
  });
  window.addEventListener('keyup', (event) => {
    if (status !== 1 || !/^[a-z]$/i.test(event.key)) return;
    const key = event.key.toUpperCase();
    // One keystroke removes one virus; higher levels require more accurate typing.
    const index = viruses.findIndex(v => v.letter === key);
    if (index === -1) return;
    const virus = viruses[index];
    const dieImg = document.createElement('img');
    dieImg.src = DEATH_IMAGE;
    dieImg.style.position = 'absolute';
    dieImg.style.left = `${virus.offsetLeft}px`;
    dieImg.style.top = `${virus.offsetTop}px`;
    dieImg.className = 'fade-out';
    game.appendChild(dieImg);
    setTimeout(() => dieImg.remove(), 1000);
    virus.remove();
    viruses.splice(index, 1);
    score++;
    scoreLabel.textContent = score;
    const previousLevel = level;
    updateDifficulty();
    if (level !== previousLevel) spawnElapsed = Math.min(spawnElapsed, settings().interval);
    refreshWarning();
    try { destroyEffect.currentTime = 0; destroyEffect.play()?.catch(() => {}); } catch (_) {}
  });
  document.querySelector('#restart-btn').addEventListener('click', resetGame);
  updateDifficulty();
})();
</script>
